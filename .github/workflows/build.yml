# Fichier .github/workflows/build.yml corrigé
name: bluebuild
on:
  schedule:
    - cron: "0 17 * * 1" # build weekly at 17:00 on Monday
  push:
    paths-ignore:
      - "README.md"
  workflow_dispatch:

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: "" # Laisse vide pour désactiver la signature obligatoire
