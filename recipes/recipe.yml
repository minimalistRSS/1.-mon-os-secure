name: secure-macos-silverblue
description: "Système immuable ultra-sécurisé basé sur Fedora Silverblue 45 avec interface style macOS et applications exclusives Flatpak."
base-image: ghcr.io/blue-build/base-images/fedora-silverblue
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  # Configuration de Flathub et installation des applications essentielles en sandbox
  - type: default-flatpaks
    configurations:
      - scope: system
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: "Flathub"
        install:
          - org.mozilla.firefox
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse

  # Intégration native des extensions GNOME pour l'ergonomie macOS
  - type: gnome-extensions
    install:
      - dash-to-dock@micxgx.gmail.com
      - blur-my-shell@aunetx
      - user-theme@gnome-shell-extensions.gcampax.github.com

  # Surcharges de configuration (GSettings) pour appliquer les thèmes et comportements initiaux
  - type: gschema-overrides
    include:
      - zz1-macos-look.gschema.override
