name: secure-macos-silverblue
description: "Mon OS immuable style macOS basé uniquement sur Flatpaks"
base-image: ghcr.io/blue-build/base-images/fedora-silverblue
image-version: 41 # Version stable actuelle très bien supportée

modules:
  # Configuration automatique de Flathub et blocage des paquets classiques
  - type: default-flatpaks
    notify: true
    system:
      repo-url: https://flathub.org
      repo-name: flathub
      repo-title: "Flathub"
      install:
        - org.mozilla.firefox
        - com.github.tchx84.Flatseal
        - io.github.flattool.Warehouse

  # Installation des extensions GNOME pour recréer l'ergonomie Mac
  - type: gnome-extensions
    install:
      - dash-to-dock@://gmail.com
      - blur-my-shell@aunetx
