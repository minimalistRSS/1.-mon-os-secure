name: secure-macos-silverblue
description: "Mon OS immuable basé uniquement sur Flatpaks"
base-image: ghcr.io/fedora-italy/silverblue-main
image-version: 41

modules:
  # Configuration automatique de Flathub et applications en bac à sable
  - type: default-flatpaks
    notify: true
    system:
      repo-url: https://flathub.org
      repo-name: flathub
      repo-title: "Flathub"
      install:
        - org.mozilla.firefox
        - com.github.tchx84.Flatseal
        - io.github.flattool.Warehouse
